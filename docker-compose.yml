services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmacia_municipal}
      POSTGRES_USER: ${POSTGRES_USER:-sam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sam_docker_password}
    volumes:
      - sam-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sam}:${POSTGRES_PASSWORD:-sam_docker_password}@db:5432/${POSTGRES_DB:-farmacia_municipal}
      JWT_SECRET: ${JWT_SECRET:-local-only-development-secret-change-me-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      AUDIT_IDENTIFIER_SECRET: ${AUDIT_IDENTIFIER_SECRET:-local-only-audit-secret-change-me-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_ROTATE_SECONDS: ${SESSION_ROTATE_SECONDS:-600}
      SESSION_ABSOLUTE_MAX_SECONDS: ${SESSION_ABSOLUTE_MAX_SECONDS:-28800}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sam-postgres-data:
