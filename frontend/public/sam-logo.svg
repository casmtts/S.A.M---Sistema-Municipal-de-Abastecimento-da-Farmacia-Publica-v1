<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" fill="none" role="img" aria-labelledby="sam-logo-title">
  <title id="sam-logo-title">S.A.M. SUS — Assistência Farmacêutica, Gestão Municipal Integrada</title>
  <defs>
    <linearGradient id="sam-dark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="60%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sam-teal-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="dark-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="420" height="110" rx="16" fill="#09182A"/>
  <g transform="translate(18 15)">
    <rect width="80" height="80" rx="22" fill="url(#sam-dark-grad)" filter="url(#dark-shadow)"/>
    <rect x="34" y="17" width="12" height="46" rx="6" fill="#fff"/>
    <rect x="17" y="34" width="46" height="12" rx="6" fill="#fff"/>
    <circle cx="65" cy="15" r="7" fill="url(#sam-teal-accent)" stroke="#09182A" stroke-width="2"/>
    <circle cx="65" cy="15" r="2.5" fill="#fff"/>
  </g>
  <g transform="translate(118 15)" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif">
    <text y="42" font-weight="900" font-size="38" fill="#fff" letter-spacing="-1">S.A.M.</text>
    <rect x="145" y="16" width="52" height="20" rx="5" fill="#0F2847" stroke="#1E4575"/>
    <text x="154" y="30" font-weight="800" font-size="10" fill="#38BDF8" letter-spacing=".5">SUS</text>
    <rect y="52" width="270" height="1.5" rx="1" fill="#1E385B"/><rect y="52" width="46" height="1.5" rx="1" fill="#38BDF8"/>
    <text y="69" font-weight="700" font-size="11.5" fill="#7DD3FC" letter-spacing="1.8">ASSISTÊNCIA FARMACÊUTICA</text>
    <text y="83" font-weight="500" font-size="10" fill="#94A3B8" letter-spacing=".6">Gestão Municipal Integrada</text>
  </g>
</svg>
