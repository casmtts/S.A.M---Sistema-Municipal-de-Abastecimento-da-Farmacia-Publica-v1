services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatório}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatório}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    # Remove a publicação de 5433 definida no compose de desenvolvimento.
    ports: !override []

  backend:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER obrigatório}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}@db:5432/${POSTGRES_DB:?POSTGRES_DB obrigatório}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatório}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS obrigatório}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      AUDIT_IDENTIFIER_SECRET: ${AUDIT_IDENTIFIER_SECRET:?AUDIT_IDENTIFIER_SECRET obrigatório}
      NODE_ENV: production
